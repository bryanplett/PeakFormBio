<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #0a0a0a;
    color: #f5f5f7;
    min-height: 100vh;
  }
  button { font-family: inherit; }

    display: inline-flex; align-items: center; justify-content: center;

  }
  .btn-primary:hover { background: #0057b3; }
  .btn-primary:active { transform: scale(0.96); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: rgba(255,255,255,0.65);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 980px;
    padding: 12px 22px; font-size: 15px; cursor: pointer; line-height: 1;
    transition: border-color 0.15s, color 0.15s, transform 0.1s; font-family: inherit;
  }
  .btn-ghost:hover { border-color: rgba(255,255,255,0.45); color: #fff; }
  .btn-ghost:active { transform: scale(0.96); }
  .form-input {
    width: 100%; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 14px 16px; font-size: 16px; font-family: inherit;
    color: #f5f5f7; background: rgba(255,255,255,0.05); outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus { border-color: #2997ff; box-shadow: 0 0 0 3px rgba(41,151,255,0.15); }
  .form-input::placeholder { color: rgba(255,255,255,0.28); }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px; padding: 20px;
  }
  .btn-blue {
    display: inline-flex; align-items: center; justify-content: center;
    background: #0066cc; color: #fff; border: none; border-radius: 980px;
    padding: 14px 28px; font-size: 16px; font-weight: 600;
    cursor: pointer; line-height: 1; transition: background 0.15s, transform 0.1s; font-family: inherit;
  }
  .btn-blue:hover { background: #0057b3; }
  .btn-blue:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 0.28s ease forwards; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
  .shake { animation: shake 0.35s ease; }

<body>
<div id="root"></div>
<script type="text/babel" src="payment-instructions.jsx"></script>
<script type="text/babel">

const GB_METHODS = [
  { id: 'venmo',    label: 'Venmo',    kind: 'handle', handle: '@Pepsoc',              hint: 'Send as Friends and Family if prompted.', enabled: true },
  { id: 'paypal',   label: 'PayPal',   kind: 'handle', handle: '@bryanplett',          hint: 'Use Friends & Family to avoid fees.',      enabled: true },
  { id: 'cashapp',  label: 'Cash App', kind: 'handle', handle: '$santacruzstyle',      hint: '', enabled: true },
  { id: 'zelle',    label: 'Zelle',    kind: 'handle', handle: 'peakformbio',          hint: 'Scan the QR code below to send.', enabled: true },
];

// Each kit's price per unit steps down at 2 and again at 3+ (matches the flyer's
// "1 kit / 2 kits / 3 kits" pricing rows). Quantities above 3 keep the 3+ price.
const KITS = [
  { id: 'reta10', name: 'Reta 10',         subtitle: '10 Vial Kit', tiers: [90, 89, 87] },
  { id: 'reta20', name: 'Reta 20',         subtitle: '10 Vial Kit', tiers: [150, 147, 145] },
  { id: 'lc526',  name: 'Fatblaster LC526', subtitle: '10 Vial Kit', tiers: [90, 89, 87] },
];
function kitUnitPrice(kit, qty) {
  if (qty <= 0) return 0;
  return kit.tiers[Math.min(qty, 3) - 1];
}
// $10 shipping for 1-3 kits total (across all products), $15 for 4 or more.
function shippingFor(totalQty) { return totalQty <= 0 ? 0 : (totalQty <= 3 ? 10 : 15); }

const GB_DEFAULTS = {
  round:         3,
  openDate:      '2026-08-13',
  closeDate:     '2026-08-27',
};

const { useState, useEffect } = React;

function useCountdown(isoDateStr) {
  const target = new Date(isoDateStr + 'T23:59:59').getTime();
  const calc = () => {
    const diff = target - Date.now();
    if (diff <= 0) return { d: 0, h: 0, m: 0, s: 0, expired: true };
    return {
      d: Math.floor(diff / 86400000),
      h: Math.floor((diff % 86400000) / 3600000),
      m: Math.floor((diff % 3600000) / 60000),
      s: Math.floor((diff % 60000) / 1000),
      expired: false
    };
  };
  const [t, setT] = useState(calc);
  useEffect(() => { const id = setInterval(() => setT(calc()), 1000); return () => clearInterval(id); }, [isoDateStr]);
  return t;
}

function PasswordGate({ onAuth }) {
  const [val, setVal] = useState('');
  const [err, setErr] = useState(false);
  const [shaking, setShaking] = useState(false);
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true);
    try {
      const r = await fetch('/api/public/groupbuy-verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: val.trim() }),
      });
      if (r.ok) {
        sessionStorage.setItem('pfb_gb_auth', '1');
        onAuth();
      } else {
        setErr(true);
        setShaking(true);
        setTimeout(() => setShaking(false), 400);
      }
    } catch (e) {
      setErr(true);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center',
      justifyContent: 'center', background: '#0a0a0a', padding: 24 }}>
      <form onSubmit={submit} style={{ width: '100%', maxWidth: 360, textAlign: 'center' }}
        className={shaking ? 'shake' : ''}>
        <img src="/1_5058098532557259934/PNG/VV/Asset 1@4x.png" alt="PeakForm Bio"
          style={{ width: 160, marginBottom: 44 }} />
        <p style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase',
          color: '#2997ff', marginBottom: 10 }}>Vendor Access Only</p>
        <h1 style={{ fontSize: 26, fontWeight: 600, color: '#f5f5f7', letterSpacing: '-0.02em', marginBottom: 8 }}>
          Group Buy
        </h1>
        <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.4)', marginBottom: 32, lineHeight: 1.5 }}>
          Enter your access code to continue.
        </p>
        <input className="form-input" type="password" placeholder="Access code" value={val} autoFocus
          onChange={(e) => { setVal(e.target.value); setErr(false); }}
          style={{ textAlign: 'center', fontSize: 18, letterSpacing: '0.08em', marginBottom: err ? 10 : 20,
            borderColor: err ? 'rgba(255,69,58,0.7)' : undefined,
            boxShadow: err ? '0 0 0 3px rgba(255,69,58,0.14)' : undefined }} />
        {err && <p style={{ fontSize: 13, color: '#ff453a', marginBottom: 14 }}>Incorrect code.</p>}
        <button className="btn-primary" type="submit" disabled={loading} style={{ width: '100%', padding: '15px' }}>
          {loading ? 'Checking...' : 'Continue'}
        </button>
      </form>
    </div>
  );
}

function CountdownBlock({ closeDate }) {
  const { d, h, m, s, expired } = useCountdown(closeDate);
  if (expired) return null;
  return (
    <div style={{ display: 'inline-flex', gap: 0, alignItems: 'center' }}>
      {[['Days', d], ['Hrs', h], ['Min', m], ['Sec', s]].map(([label, val], i) => (
        <React.Fragment key={label}>
          {i > 0 && <span style={{ fontSize: 20, color: 'rgba(255,255,255,0.2)', margin: '0 4px', lineHeight: 1, paddingBottom: 14 }}>:</span>}
          <div style={{ textAlign: 'center', minWidth: 52 }}>
            <div style={{ fontSize: 32, fontWeight: 700, color: '#fff', letterSpacing: '-0.03em', lineHeight: 1 }}>
              {String(val).padStart(2, '0')}
            </div>
            <div style={{ fontSize: 9, fontWeight: 600, color: 'rgba(255,255,255,0.35)',
              letterSpacing: '0.12em', textTransform: 'uppercase', marginTop: 5 }}>{label}</div>
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

function MethodSelector({ methods, chosen, onChange }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      {methods.map((m) => (
        <button key={m.id} type="button" onClick={() => onChange(m.id)} style={{
          display: 'flex', alignItems: 'center', gap: 12,
          padding: '14px 16px', borderRadius: 12, cursor: 'pointer', textAlign: 'left',
          border: chosen === m.id ? '1px solid rgba(41,151,255,0.6)' : '1px solid rgba(255,255,255,0.09)',
          background: chosen === m.id ? 'rgba(41,151,255,0.08)' : 'rgba(255,255,255,0.03)',
          fontFamily: 'inherit', transition: 'all 0.15s',
        }}>
          <div style={{ width: 18, height: 18, borderRadius: '50%', flexShrink: 0,
            border: chosen === m.id ? '2px solid #2997ff' : '2px solid rgba(255,255,255,0.25)',
            background: chosen === m.id ? '#2997ff' : 'transparent',
            display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            {chosen === m.id && <div style={{ width: 6, height: 6, borderRadius: '50%', background: '#fff' }} />}
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 15, fontWeight: 500, color: '#f5f5f7' }}>{m.label}</span>
              {m.network && <span style={{ fontSize: 11, color: '#ff9f0a', background: 'rgba(255,159,10,0.12)',
                border: '1px solid rgba(255,159,10,0.25)', borderRadius: 999, padding: '2px 8px', fontWeight: 600 }}>{m.network}</span>}
            </div>
            {m.hint && <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.35)', marginTop: 2 }}>{m.hint}</div>}
          </div>
        </button>
      ))}
    </div>
  );
}

function GroupBuyPage() {
  const [settings, setSettings] = useState(Object.assign({ stock: { reta10: 60, reta20: 35, lc526: 8 } }, GB_DEFAULTS));
  useEffect(() => {
    fetch('/api/public/groupbuy-settings')
      .then(r => r.json())
      .then(s => setSettings(prev => Object.assign({}, prev, GB_DEFAULTS, s, { stock: Object.assign({}, prev.stock, s.stock) })))
      .catch(() => {});
  }, []);
  const stock = settings.stock || {};
  const allSoldOut = KITS.every(kit => (stock[kit.id] || 0) <= 0);

  const now = new Date();
  const openDate  = new Date(settings.openDate  + 'T00:00:00');
  const closeDate = new Date(settings.closeDate + 'T23:59:59');
  const isOpen  = now >= openDate && now <= closeDate;
  const isClosed = now > closeDate;
  const notYet  = now < openDate;

  const [step, setStep] = useState(() => Number(sessionStorage.getItem('pfb_gb_step') || 1));
  const [form, setForm] = useState(() => {
    try { return JSON.parse(sessionStorage.getItem('pfb_gb_form') || '{"name":"","email":"","phone":"","address":""}'); }
    catch (e) { return { name: '', email: '', phone: '', address: '' }; }
  });
  const [kitQty, setKitQty] = useState(() => {
    try { return JSON.parse(sessionStorage.getItem('pfb_gb_kits') || '{}'); }
    catch (e) { return {}; }
  });
  const [chosenMethod, setChosenMethod] = useState(() => sessionStorage.getItem('pfb_gb_method') || '');
  const [reported, setReported] = useState(() => sessionStorage.getItem('pfb_gb_reported') === '1');
  const [orderRef] = useState(() => {
    const saved = sessionStorage.getItem('pfb_gb_ref');
    if (saved) return saved;
    const ref = 'GB-' + Math.random().toString(36).slice(2, 7).toUpperCase();
    sessionStorage.setItem('pfb_gb_ref', ref);
    return ref;
  });

  const setQty = (id, qty) => setKitQty(k => Object.assign({}, k, { [id]: Math.max(0, Math.min(stock[id] ?? 20, qty)) }));
  const [orderError, setOrderError] = useState('');

  const save = (s, f, m, k) => {
    sessionStorage.setItem('pfb_gb_step', s);
    sessionStorage.setItem('pfb_gb_form', JSON.stringify(f));
    if (m !== undefined) sessionStorage.setItem('pfb_gb_method', m);
    if (k !== undefined) sessionStorage.setItem('pfb_gb_kits', JSON.stringify(k));
  };

  const lines = KITS.map(kit => {
    const qty = kitQty[kit.id] || 0;
    const unit = kitUnitPrice(kit, qty);
    return { kit, qty, unit, lineTotal: unit * qty };
  }).filter(l => l.qty > 0);
  const totalKits  = lines.reduce((s, l) => s + l.qty, 0);
  const kitTotal    = lines.reduce((s, l) => s + l.lineTotal, 0);
  const shippingCost = shippingFor(totalKits);
  const grandTotal  = kitTotal + shippingCost;

  const handleReported = async () => {
    setOrderError('');
    try {
      const r = await fetch('/api/notifications/groupbuy-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: form.name, email: form.email, phone: form.phone, address: form.address,
          kits: lines.reduce((acc, l) => Object.assign(acc, { [l.kit.id]: l.qty }), {}),
          payment_method: chosenMethod, order_ref: orderRef, total: grandTotal,
        }),
      });
      if (r.status === 409) {
        const body = await r.json().catch(() => ({}));
        const names = (body.insufficient || []).map(id => (KITS.find(k => k.id === id) || {}).name || id).join(', ');
        setOrderError(`${names || 'One of your kits'} just sold out — look out for the next banger from PeakFormBio!`);
        fetch('/api/public/groupbuy-settings').then(res => res.json()).then(s => setSettings(prev => Object.assign({}, prev, s, { stock: Object.assign({}, prev.stock, s.stock) }))).catch(() => {});
        return;
      }
      if (!r.ok) { setOrderError('Something went wrong submitting your order. Please try again.'); return; }
    } catch (e) {
      setOrderError('Something went wrong submitting your order. Please try again.');
      return;
    }
    setReported(true);
    sessionStorage.setItem('pfb_gb_reported', '1');
  };

  const fmtDate = (str) => new Date(str + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric' });

  return (
    <div style={{ minHeight: '100vh', background: '#0a0a0a' }}>

      <nav style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 500,
        background: 'rgba(0,0,0,0.88)', backdropFilter: 'blur(20px)',
        height: 52, display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 28px', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
        <img src="/1_5058098532557259934/PNG/VH/PFB_VH (7).png" alt="PeakForm Bio" style={{ height: 15 }} />
        <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.10em', textTransform: 'uppercase',
          color: '#2997ff', background: 'rgba(41,151,255,0.12)', border: '1px solid rgba(41,151,255,0.28)',
          borderRadius: 999, padding: '4px 10px' }}>Vendor Group Buy{settings.round > 1 ? ` - Round ${settings.round}` : ''}</span>
      </nav>

      <div style={{ position: 'relative', paddingTop: 52, minHeight: 520, display: 'flex', alignItems: 'flex-end' }}>
        <img src="/uploads/istockphoto-470062516-612x612.jpg" alt=""
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%',
            objectFit: 'cover', objectPosition: 'center 30%' }} />
        <div style={{ position: 'absolute', inset: 0,
          background: 'linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.65) 55%, rgba(10,10,10,1) 100%)' }} />

        <div style={{ position: 'relative', zIndex: 2, width: '100%',
          maxWidth: 680, margin: '0 auto', padding: '0 24px 56px', textAlign: 'center' }}>

          {isOpen && (
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, marginBottom: 20,
              background: 'rgba(52,199,89,0.12)', border: '1px solid rgba(52,199,89,0.32)',
              borderRadius: 999, padding: '6px 14px' }}>
              <div style={{ width: 6, height: 6, borderRadius: '50%', background: '#30d158' }} />
              <span style={{ fontSize: 12, fontWeight: 600, color: '#30d158', letterSpacing: '0.06em' }}>
                OPEN {fmtDate(settings.openDate).toUpperCase()} - {fmtDate(settings.closeDate).toUpperCase()}
              </span>
            </div>
          )}
          {isClosed && <div style={{ display: 'inline-block', marginBottom: 20,
            background: 'rgba(255,69,58,0.12)', border: '1px solid rgba(255,69,58,0.32)',
            borderRadius: 999, padding: '6px 16px', fontSize: 12, fontWeight: 600, color: '#ff453a' }}>CLOSED</div>}
          {notYet && <div style={{ display: 'inline-block', marginBottom: 20,
            background: 'rgba(255,159,10,0.12)', border: '1px solid rgba(255,159,10,0.32)',
            borderRadius: 999, padding: '6px 16px', fontSize: 12, fontWeight: 600, color: '#ff9f0a' }}>
            OPENS {fmtDate(settings.openDate).toUpperCase()}</div>}

          <h1 style={{ fontSize: 'clamp(36px,6vw,56px)', fontWeight: 700, color: '#fff',
            letterSpacing: '-0.035em', lineHeight: 1.02, marginBottom: 8 }}>Group Buy</h1>
          <p style={{ fontSize: 17, color: 'rgba(255,255,255,0.55)', marginBottom: 28 }}>Reta 10 &middot; Reta 20 &middot; Fatblaster LC526</p>

          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center', marginBottom: 20 }}>
            {KITS.map(kit => {
              const remaining = stock[kit.id] ?? 0;
              const soldOut = remaining <= 0;
              return (
              <div key={kit.id} style={{ borderRadius: 16, padding: '16px 20px', textAlign: 'center', minWidth: 148, position: 'relative',
                background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.08)', opacity: soldOut ? 0.5 : 1 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: '#fff', marginBottom: 2 }}>{kit.name}</div>
                <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.35)', marginBottom: 10 }}>{kit.subtitle}</div>
                {soldOut ? (
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: '#ff453a', padding: '8px 0' }}>SOLD OUT</div>
                ) : kit.tiers.map((price, i) => (
                  <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5,
                    color: i === 0 ? '#fff' : 'rgba(255,255,255,0.55)', fontWeight: i === 0 ? 700 : 400, padding: '2px 0' }}>
                    <span>{i + 1}{i === 2 ? '+' : ''} kit{i > 0 ? 's' : ''}</span>
                    <span>${price}</span>
                  </div>
                ))}
              </div>
              );
            })}
          </div>

          <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.45)', marginBottom: 28, lineHeight: 1.55 }}>
            All kits ship from California, same day. Shipping is ${shippingFor(1)} for 1&ndash;3 kits, ${shippingFor(4)} for 4 or more.
          </p>

          {isOpen && (
            <div>
              <p style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase',
                color: 'rgba(255,255,255,0.3)', marginBottom: 10 }}>Closes in</p>
              <CountdownBlock closeDate={settings.closeDate} />
            </div>
          )}
        </div>
      </div>

      {isOpen && !allSoldOut ? (
        <div style={{ maxWidth: 520, margin: '0 auto', padding: '40px 20px 100px' }}>
          <div style={{ display: 'flex', gap: 5, marginBottom: 32 }}>
            {[1,2,3].map((s) => (
              <div key={s} style={{ height: 3, flex: 1, borderRadius: 2,
                background: s <= step ? '#0066cc' : 'rgba(255,255,255,0.10)',
                transition: 'background 0.3s' }} />
            ))}
          </div>

          {step === 1 && (
            <div className="fade-up">
              <h2 style={{ fontSize: 22, fontWeight: 600, color: '#f5f5f7', letterSpacing: '-0.02em', marginBottom: 6 }}>Your order</h2>
              <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.4)', marginBottom: 24 }}>Choose your kits, then fill in your info.</p>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 24 }}>
                {KITS.map(kit => {
                  const qty = kitQty[kit.id] || 0;
                  const unit = kitUnitPrice(kit, qty);
                  const remaining = stock[kit.id] ?? 0;
                  const soldOut = remaining <= 0;
                  return (
                    <div key={kit.id} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 16px',
                      borderRadius: 12, opacity: soldOut ? 0.5 : 1,
                      border: qty > 0 ? '1px solid rgba(41,151,255,0.5)' : '1px solid rgba(255,255,255,0.09)',
                      background: qty > 0 ? 'rgba(41,151,255,0.06)' : 'rgba(255,255,255,0.03)' }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 15, fontWeight: 600, color: '#f5f5f7' }}>{kit.name}</div>
                        <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.4)', marginTop: 2 }}>
                          {soldOut ? <span style={{ color: '#ff453a', fontWeight: 600 }}>Sold out</span> : (
                            <>{kit.subtitle} &middot; {qty > 0 ? `$${unit}/kit` : `from $${kit.tiers[2]}/kit`} &middot; {remaining} left</>
                          )}
                        </div>
                      </div>
                      <button type="button" disabled={soldOut} onClick={() => setQty(kit.id, qty - 1)}
                        style={{ width: 34, height: 34, borderRadius: '50%', border: '1px solid rgba(255,255,255,0.14)',
                          background: 'rgba(255,255,255,0.05)', color: '#fff', fontSize: 18, cursor: soldOut ? 'not-allowed' : 'pointer',
                          display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'inherit' }}>-</button>
                      <span style={{ fontSize: 18, fontWeight: 700, color: '#fff', minWidth: 22, textAlign: 'center' }}>{qty}</span>
                      <button type="button" disabled={soldOut || qty >= remaining} onClick={() => setQty(kit.id, qty + 1)}
                        style={{ width: 34, height: 34, borderRadius: '50%', border: '1px solid rgba(255,255,255,0.14)',
                          background: 'rgba(255,255,255,0.05)', color: '#fff', fontSize: 18, cursor: (soldOut || qty >= remaining) ? 'not-allowed' : 'pointer',
                          display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'inherit', opacity: (soldOut || qty >= remaining) ? 0.4 : 1 }}>+</button>
                    </div>
                  );
                })}
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 16, marginBottom: 24 }}>
                <div>
                  <label style={{ fontSize: 13, fontWeight: 600, color: 'rgba(255,255,255,0.65)', display: 'block', marginBottom: 8 }}>Full Name</label>
                  <input className="form-input" type="text" placeholder="Alex Johnson"
                    value={form.name} onChange={(e) => setForm(f => Object.assign({}, f, { name: e.target.value }))} />
                </div>
                <div>
                  <label style={{ fontSize: 13, fontWeight: 600, color: 'rgba(255,255,255,0.65)', display: 'block', marginBottom: 8 }}>Email</label>
                  <input className="form-input" type="email" placeholder="you@business.com"
                    value={form.email} onChange={(e) => setForm(f => Object.assign({}, f, { email: e.target.value }))} />
                </div>
                <div>
                  <label style={{ fontSize: 13, fontWeight: 600, color: 'rgba(255,255,255,0.65)', display: 'block', marginBottom: 8 }}>Phone Number</label>
                  <input className="form-input" type="tel" placeholder="+1 (555) 000-0000"
                    value={form.phone} onChange={(e) => setForm(f => Object.assign({}, f, { phone: e.target.value }))} />
                </div>
                <div>
                  <label style={{ fontSize: 13, fontWeight: 600, color: 'rgba(255,255,255,0.65)', display: 'block', marginBottom: 8 }}>Shipping Address</label>
                  <textarea className="form-input" placeholder="123 Main St, City, State 12345" rows={3}
                    value={form.address} onChange={(e) => setForm(f => Object.assign({}, f, { address: e.target.value }))}
                    style={{ resize: 'vertical', minHeight: 80, lineHeight: 1.5 }} />
                </div>
              </div>

              <div style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)',
                borderRadius: 14, padding: '16px 18px', marginBottom: 24 }}>
                {lines.length === 0 ? (
                  <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.4)' }}>Choose at least one kit above.</p>
                ) : (
                  <>
                    {lines.map(l => (
                      <div key={l.kit.id} style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                        <span style={{ fontSize: 14, color: 'rgba(255,255,255,0.5)' }}>{l.kit.name} x {l.qty}</span>
                        <span style={{ fontSize: 14, color: '#f5f5f7' }}>${l.lineTotal}</span>
                      </div>
                    ))}
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 10 }}>
                      <span style={{ fontSize: 14, color: 'rgba(255,255,255,0.5)' }}>Shipping ({totalKits} kit{totalKits > 1 ? 's' : ''})</span>
                      <span style={{ fontSize: 14, color: '#f5f5f7' }}>${shippingCost}</span>
                    </div>
                    <div style={{ borderTop: '1px solid rgba(255,255,255,0.07)', paddingTop: 10,
                      display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ fontSize: 15, fontWeight: 600, color: '#f5f5f7' }}>Total</span>
                      <span style={{ fontSize: 15, fontWeight: 700, color: '#fff' }}>${grandTotal}</span>
                    </div>
                  </>
                )}
              </div>

              <button className="btn-primary" disabled={!form.name || !form.email || !form.phone || !form.address || lines.length === 0}
                onClick={() => { const n = 2; setStep(n); save(n, form, chosenMethod, kitQty); }}
                style={{ width: '100%', padding: '16px', fontSize: 17 }}>
                Continue to Payment
              </button>
            </div>
          )}

          {step === 2 && (
            <div className="fade-up">
              <h2 style={{ fontSize: 22, fontWeight: 600, color: '#f5f5f7', letterSpacing: '-0.02em', marginBottom: 6 }}>Payment method</h2>
              <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.4)', marginBottom: 24 }}>
                Ref: <code style={{ fontFamily: 'monospace', color: '#2997ff' }}>{orderRef}</code>
                <span style={{ marginLeft: 10, color: 'rgba(255,255,255,0.4)' }}>Total: ${grandTotal}</span>
              </p>
              <MethodSelector methods={GB_METHODS} chosen={chosenMethod} onChange={setChosenMethod} />
              <div style={{ display: 'flex', gap: 10, marginTop: 24 }}>
                <button className="btn-ghost" onClick={() => { setStep(1); save(1, form, chosenMethod, kitQty); }}>Back</button>
                <button className="btn-primary" disabled={!chosenMethod}
                  onClick={() => { const n = 3; setStep(n); save(n, form, chosenMethod, kitQty); }}
                  style={{ flex: 1, padding: '15px', fontSize: 16 }}>Continue</button>
              </div>
            </div>
          )}

          {step === 3 && (
            <div className="fade-up">
              <h2 style={{ fontSize: 22, fontWeight: 600, color: '#f5f5f7', letterSpacing: '-0.02em', marginBottom: 16 }}>Send payment</h2>

              <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start',
                background: 'rgba(41,151,255,0.08)', border: '1px solid rgba(41,151,255,0.35)',
                borderRadius: 12, padding: '14px 16px', marginBottom: 20 }}>
                <span style={{ fontSize: 18, flexShrink: 0 }}>📋</span>
                <div style={{ flex: 1 }}>
                  <p style={{ fontSize: 14, fontWeight: 700, color: '#2997ff', marginBottom: 6 }}>Include your order number in the payment note</p>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'rgba(0,0,0,0.25)',
                    border: '1px solid rgba(255,255,255,0.08)', borderRadius: 8, padding: '8px 12px' }}>
                    <code style={{ fontFamily: 'monospace', fontSize: 15, fontWeight: 700, color: '#fff', flex: 1 }}>{orderRef}</code>
                    <button type="button" onClick={() => {
                      try { navigator.clipboard.writeText(orderRef); } catch(e) {}
                    }} style={{ fontFamily: 'inherit', fontSize: 12, fontWeight: 600, padding: '5px 12px',
                      borderRadius: 7, border: '1px solid rgba(41,151,255,0.5)', background: 'transparent',
                      color: '#2997ff', cursor: 'pointer', whiteSpace: 'nowrap' }}>Copy</button>
                  </div>
                  <p style={{ fontSize: 12, color: 'rgba(255,255,255,0.45)', marginTop: 6 }}>
                    Nothing else — no names, no product details. Just this number.
                  </p>
                </div>
              </div>

              <PaymentInstructions
                amountDue={grandTotal}
                reference={orderRef}
                methods={GB_METHODS}
                chosenId={chosenMethod}
                reported={reported}
                onReported={handleReported}
                businessName="PeakForm Bio"
              />
              {orderError && (
                <p style={{ fontSize: 13, color: '#ff453a', marginTop: 14, textAlign: 'center', lineHeight: 1.5 }}>{orderError}</p>
              )}
              {!reported && (
                <button className="btn-ghost" onClick={() => { setStep(2); save(2, form, chosenMethod, kitQty); }}
                  style={{ marginTop: 14, width: '100%' }}>Back to payment method</button>
              )}
              {reported && (
                <button className="btn-primary" onClick={() => {
                  ['pfb_gb_step','pfb_gb_form','pfb_gb_kits','pfb_gb_method','pfb_gb_reported','pfb_gb_ref'].forEach(k => sessionStorage.removeItem(k));
                  window.location.reload();
                }} style={{ marginTop: 14, width: '100%', padding: '15px' }}>Start a new order</button>
              )}
            </div>
          )}
        </div>
      ) : !isOpen ? (
        <div style={{ textAlign: 'center', padding: '60px 24px 100px' }}>
          <p style={{ fontSize: 16, color: 'rgba(255,255,255,0.4)' }}>
            {isClosed
              ? 'This group buy has closed. Check back for the next cycle.'
              : 'This group buy opens ' + fmtDate(settings.openDate) + '.'}
          </p>
        </div>
      ) : (
        <div style={{ textAlign: 'center', padding: '60px 24px 100px' }}>
          <p style={{ fontSize: 20, fontWeight: 700, color: '#fff', marginBottom: 10 }}>All kits are sold out!</p>
          <p style={{ fontSize: 15, color: 'rgba(255,255,255,0.5)' }}>Look out for the next banger from PeakFormBio!</p>
        </div>
      )}
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(() => sessionStorage.getItem('pfb_gb_auth') === '1');
  if (!authed) return React.createElement(PasswordGate, { onAuth: () => setAuthed(true) });
  return React.createElement(GroupBuyPage, null);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
